name: desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Python tests (standard library)
        run: |
          python -m unittest discover -s tests -p test_save.py
          python tools/embed_fields.py --check
          python tools/embed_entitydb.py --check
      - name: Browser tests
        run: |
          pip install playwright==1.61.0
          playwright install --with-deps chromium
          python -m unittest discover -s tests
      - name: Desktop smoke test
        working-directory: desktop
        run: |
          npm ci
          xvfb-run -a npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: --linux
            name: linux
          - os: windows-latest
            flags: --win
            name: windows
          - os: macos-latest
            flags: --mac --x64 --arm64
            name: macos
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Pick version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npx electron-builder ${{ matrix.flags }} --publish never -c.extraMetadata.version="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
